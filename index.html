<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crystal Grimoire</title>
<meta name="description" content="Crystal Grimoire: Idle Mage, a game for Android. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700&family=Alegreya+Sans:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #1a1726; --ink: #ece2cc; --muted: #aaa0b6; --gilt: #e0b45a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: var(--bg); color: var(--ink); font-family: "Alegreya Sans", sans-serif; padding: 16px; }
  main { max-width: 34rem; text-align: center; }
  h1 { font-family: "Alegreya SC", serif; font-size: clamp(2rem, 8vw, 3.2rem); margin: 0 0 .3em; color: var(--gilt); }
  p { font-size: 1.15rem; line-height: 1.5; margin: .4em 0; }
  .muted { color: var(--muted); }
  a { color: var(--gilt); }
</style>
</head>
<body>
<main>
  <h1>Crystal Grimoire</h1>
  <p>An idle game of seven crystals, a tower and a moth called Wick.</p>
  <p class="muted">Coming soon to Google Play.</p>
  <p class="muted">Contact: <a href="mailto:crystalgrimoire.game@outlook.com">crystalgrimoire.game@outlook.com</a></p>
</main>
</body>
</html>
